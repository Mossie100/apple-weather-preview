workflows:
  apple-weather-native-preview:
    name: Apple Weather native preview 2
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Build separate native renderer preview
        script: python3 build.py
    artifacts:
      - build/Apple-Weather-Native-Preview-2-UNSIGNED.ipa
      - build/build-proof.json
      - build/build.log
